name: Multi-app checks

on:
  push:
    branches:
      - main
      - multi-app-architecture
  pull_request:
    branches:
      - main

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: App registry checks
        run: npm run test:app-registry

      - name: App request isolation checks
        run: npm run test:app-request

      - name: Server syntax checks
        run: |
          node --check src/server.js
          node --check src/server-multi-app.js
          node --check src/firebase-admin-auth.js
