name: Multi-app safety

on:
  push:
    branches: [main, multi-app-architecture]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run test:app-registry
      - run: npm run test:app-request
      - run: node --check src/server.js
      - run: node --check src/server-multi-app.js
      - run: node --check src/firebase-admin-auth.js
